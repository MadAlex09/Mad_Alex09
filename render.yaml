services:
  - type: worker
    name: madalex-gameclub-bot
    runtime: python
    rootDir: telegram_bot
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: CLUB_NAME
        value: Game Club
      - key: CLUB_ADDRESS
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: BOT_TIMEZONE
        value: Asia/Qyzylorda
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
